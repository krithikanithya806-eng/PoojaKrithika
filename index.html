```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Canteen Order</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <h1>🍴 Smart Canteen Order</h1>

    <p>
        Order your favourite food quickly and easily
    </p>

</header>


<!-- ================= NAVIGATION ================= -->

<nav>

    <a href="#menu">Menu</a>

    <a href="#cart">
        Cart 🛒
        <span id="cartCount">0</span>
    </a>

    <a href="#checkout">
        Checkout
    </a>

    <a href="#orders">
        My Orders
    </a>

</nav>


<!-- ================= MENU ================= -->

<section id="menu" class="container">

    <h2>🍽️ Today's Menu</h2>


    <!-- SEARCH -->

    <input
        type="text"
        id="searchInput"
        placeholder="🔎 Search menu..."
    >


    <!-- CATEGORIES -->

    <div class="categories">

        <button
            class="category-btn active"
            onclick="filterCategory('All')"
        >
            All
        </button>

        <button
            class="category-btn"
            onclick="filterCategory('Breakfast')"
        >
            Breakfast
        </button>

        <button
            class="category-btn"
            onclick="filterCategory('Meals')"
        >
            Meals
        </button>

        <button
            class="category-btn"
            onclick="filterCategory('Snacks')"
        >
            Snacks
        </button>

        <button
            class="category-btn"
            onclick="filterCategory('Fast Food')"
        >
            Fast Food
        </button>

        <button
            class="category-btn"
            onclick="filterCategory('Drinks')"
        >
            Drinks
        </button>

        <button
            class="category-btn"
            onclick="filterCategory('Non-Veg')"
        >
            Non-Veg
        </button>

    </div>


    <!-- FOOD MENU -->

    <div
        id="menuGrid"
        class="menu-grid"
    ></div>


</section>


<!-- ================= CART ================= -->

<section
    id="cart"
    class="container"
>

    <h2>🛒 Your Cart</h2>

    <div id="cartItems">

        <p>
            Your cart is empty.
        </p>

    </div>


    <div class="cart-total">

        Total:
        ₹<span id="total">0</span>

    </div>

</section>


<!-- ================= CHECKOUT ================= -->

<section
    id="checkout"
    class="container checkout"
>

    <h2>💳 Checkout</h2>


    <form id="orderForm">


        <!-- CUSTOMER NAME -->

        <label for="name">
            Customer Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >


        <!-- PHONE -->

        <label for="phone">
            Phone Number
        </label>

        <input
            type="tel"
            id="phone"
            placeholder="Enter phone number"
            pattern="[0-9]{10}"
            maxlength="10"
            required
        >


        <!-- PAYMENT -->

        <label for="payment">
            Payment Mode
        </label>

        <select
            id="payment"
            required
        >

            <option value="">
                -- Select Payment Mode --
            </option>

            <option value="Cash">
                Cash
            </option>

            <option value="UPI">
                UPI
            </option>

            <option value="Debit/Credit Card">
                Debit / Credit Card
            </option>

            <option value="Online Payment">
                Online Payment
            </option>

        </select>


        <!-- PAYMENT DETAILS -->

        <div id="paymentDetails"></div>


        <button
            type="submit"
            class="order-btn"
        >
            Place Order
        </button>


    </form>


    <!-- ORDER CONFIRMATION -->

    <div id="confirmation"></div>


</section>


<!-- ================= ORDER HISTORY ================= -->

<section
    id="orders"
    class="container"
>

    <h2>📜 My Order History</h2>

    <div id="orderHistory">

        <p>
            No previous orders.
        </p>

    </div>

</section>


<!-- ================= TRACK ORDER ================= -->

<section
    class="container tracking"
>

    <h2>🚚 Track Your Order</h2>


    <input
        type="text"
        id="trackOrderId"
        placeholder="Enter Order ID"
    >


    <button
        onclick="trackOrder()"
    >
        Track Order
    </button>


    <div id="trackingResult"></div>


</section>


<!-- ================= FOOTER ================= -->

<footer>

    <p>
        © 2026 Smart Canteen Order
    </p>

</footer>


<script src="script.js"></script>

</body>

</html>
```
